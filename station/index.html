<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>關主計分台 - XSHS LandQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap');
    * { max-width: 100%; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }
    .glass-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .btn-touch { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="p-4 selection:bg-amber-500 selection:text-slate-950 flex flex-col justify-between min-h-screen">

  <div id="toastContainer" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[9999] flex flex-col items-center gap-2 pointer-events-none w-[92%] max-w-md"></div>

  <div class="max-w-2xl mx-auto w-full space-y-5">
    <header class="flex justify-between items-center bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-950 font-black flex items-center justify-center text-lg shadow">
          <i class="fa-solid fa-headset"></i>
        </div>
        <div>
          <h1 id="stationHeaderTitle" class="text-lg font-black text-slate-900">關主計分台 (A~J)</h1>
          <p class="text-xs text-slate-500 font-medium">/station/index.html</p>
        </div>
      </div>
      <a href="../index.html" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs border border-slate-300">總入口</a>
    </header>

    <div class="glass-card p-5 rounded-3xl space-y-4 border border-slate-200 shadow-sm">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <h2 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-amber-600"></i> 成績登記 (項目一 + 項目二)
        </h2>
        <button onclick="openQrScannerModal()" class="px-3 py-1.5 bg-slate-800 text-white rounded-xl text-xs font-bold hover:bg-slate-700 flex items-center gap-1">
          <i class="fa-solid fa-camera text-amber-400"></i> 掃 QR Code
        </button>
      </div>

      <!-- 選擇小隊 -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">選擇登記隊伍 (401A~410B)：</label>
        <select id="stationTeamSelect" class="w-full p-3 border border-slate-300 rounded-2xl font-bold text-slate-900 text-sm bg-white outline-none focus:border-amber-500">
          <option value="">-- 請選擇小隊 --</option>
        </select>
      </div>

      <!-- 兩階段分數項目選擇 -->
      <div class="space-y-3.5 p-4 bg-amber-50/60 rounded-2xl border border-amber-200">
        <!-- 項目一：基本勝敗成績 -->
        <div>
          <label class="block text-xs font-black text-slate-800 mb-1.5 flex items-center gap-1.5">
            <span class="w-5 h-5 rounded-full bg-amber-500 text-slate-950 font-black text-[10px] flex items-center justify-center">1</span>
            <span>項目一：基本勝敗成績 (必選)</span>
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btnResultWin" onclick="setResultType('WIN')" class="btn-touch py-2.5 px-3 bg-amber-500 text-slate-950 rounded-xl font-black text-xs transition shadow border-2 border-amber-600 flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-trophy"></i> 勝隊 (+1000分)
            </button>
            <button type="button" id="btnResultLoss" onclick="setResultType('LOSS')" class="btn-touch py-2.5 px-3 bg-slate-100 text-slate-600 border border-slate-300 rounded-xl font-bold text-xs transition flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-medal"></i> 敗隊 (+500分)
            </button>
          </div>
        </div>

        <!-- 項目二：諂媚表現加分 -->
        <div>
          <label class="block text-xs font-black text-slate-800 mb-1.5 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="w-5 h-5 rounded-full bg-amber-500 text-slate-950 font-black text-[10px] flex items-center justify-center">2</span>
              <span>項目二：諂媚表現加分</span>
            </span>
            <span id="flatteryScopeLabel" class="text-[10px] text-amber-800 font-bold bg-amber-100 px-2 py-0.5 rounded border border-amber-300">(勝隊選項)</span>
          </label>
          <div id="flatteryButtonsGroup" class="grid grid-cols-3 gap-2">
          </div>
        </div>

        <!-- 最終分數 -->
        <div class="pt-1">
          <label class="block text-[11px] font-bold text-slate-500 mb-1">最終給分數 (項目一 + 項目二，自動計算禁止修改)：</label>
          <input type="number" id="stationPointsInput" value="1000" readonly class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm font-mono font-black bg-slate-100 text-slate-900 outline-none cursor-not-allowed">
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-bold text-slate-700">備註說明 (選填)：</label>
        <input type="text" id="stationNoteInput" placeholder="例如：表現優異..." class="w-full p-3 border border-slate-300 rounded-2xl text-xs bg-white text-slate-900 outline-none">
      </div>

      <button id="btnSubmitScore" onclick="submitStationScore()" class="btn-touch w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl shadow transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> 送出得分並更新排行榜
      </button>
    </div>

    <!-- 關卡計時器與最近明細 -->
    <div class="glass-card p-5 rounded-3xl space-y-3 border border-slate-200">
      <h3 class="font-extrabold text-slate-900 text-sm flex items-center gap-2 pb-2 border-b border-slate-200">
        <i class="fa-solid fa-stopwatch text-amber-600"></i> 關卡計時器
      </h3>
      <div class="text-center py-2">
        <div id="timerDisplay" class="text-4xl font-black font-mono text-slate-900">05:00.0</div>
      </div>
      <div class="flex gap-2">
        <button onclick="toggleTimer()" id="timerStartBtn" class="btn-touch flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs shadow">開始計時</button>
        <button onclick="resetTimer()" class="btn-touch px-4 py-2 bg-slate-100 border border-slate-300 text-slate-700 font-bold rounded-xl text-xs">重置</button>
      </div>
    </div>
  </div>

  <footer class="text-center text-slate-500 text-xs py-4">
    <p>臺中市立新社高級中學 關主計分控制台 &copy; 2026</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://xfevmqguantotrkatvoa.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uQcbXqsRGxU-uLRagPtwHQ_6SSAUT59';
    let supabaseClient = null;
    try {
      if (typeof window.supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
      }
    } catch(e){}

    const TEAM_NAMES = ['401A', '401B', '402A', '402B', '403A', '403B', '404A', '404B', '405A', '405B', '406A', '406B', '407A', '407B', '408A', '408B', '409A', '409B', '410A', '410B'];
    let selectedResultType = 'WIN';
    let selectedFlatteryScore = 0;

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      let bgClass = 'bg-slate-800 text-white border-slate-700 shadow-xl';
      if (type === 'success') bgClass = 'bg-emerald-600 text-white border-emerald-500 shadow-xl';
      else if (type === 'error') bgClass = 'bg-rose-600 text-white border-rose-500 shadow-xl';
      toast.className = `px-4 py-2.5 rounded-2xl border text-xs font-semibold pointer-events-auto flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-2 opacity-0 w-full ${bgClass}`;
      toast.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" class="text-xs opacity-60 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>`;
      container.appendChild(toast);
      requestAnimationFrame(() => { toast.classList.remove('translate-y-2', 'opacity-0'); });
      setTimeout(() => { toast.remove(); }, 3000);
    }

    function setResultType(type) {
      selectedResultType = type;
      selectedFlatteryScore = 0;
      updateScoringUI();
    }

    function setFlatteryScore(pts) {
      selectedFlatteryScore = pts;
      updateScoringUI();
    }

    function updateScoringUI() {
      const btnWin = document.getElementById('btnResultWin');
      const btnLoss = document.getElementById('btnResultLoss');
      const scopeLabel = document.getElementById('flatteryScopeLabel');
      const flatteryGroup = document.getElementById('flatteryButtonsGroup');
      const scoreInput = document.getElementById('stationPointsInput');

      if (!btnWin || !btnLoss) return;

      if (selectedResultType === 'WIN') {
        btnWin.className = "btn-touch py-2.5 px-3 bg-amber-500 text-slate-950 rounded-xl font-black text-xs shadow border-2 border-amber-600 flex items-center justify-center gap-1.5";
        btnLoss.className = "btn-touch py-2.5 px-3 bg-slate-100 text-slate-600 border border-slate-300 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5";
        if (scopeLabel) scopeLabel.innerText = "(勝隊加分: +0, +50, +100)";
        
        const winFlatteryOpts = [0, 50, 100];
        if (flatteryGroup) {
          flatteryGroup.innerHTML = winFlatteryOpts.map(pts => {
            const isActive = selectedFlatteryScore === pts;
            return `
              <button type="button" onclick="setFlatteryScore(${pts})" class="btn-touch py-2 px-1 ${isActive ? 'bg-amber-400 border-2 border-amber-600 text-slate-950 font-black shadow' : 'bg-slate-50 border border-slate-300 text-slate-700 font-bold'} rounded-xl text-xs transition text-center flex flex-col items-center justify-center">
                <span class="text-xs font-black">+${pts} 分</span>
              </button>
            `;
          }).join('');
        }
        if (scoreInput) scoreInput.value = 1000 + selectedFlatteryScore;
      } else {
        btnWin.className = "btn-touch py-2.5 px-3 bg-slate-100 text-slate-600 border border-slate-300 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5";
        btnLoss.className = "btn-touch py-2.5 px-3 bg-slate-800 text-amber-400 rounded-xl font-black text-xs shadow border-2 border-slate-900 flex items-center justify-center gap-1.5";
        if (scopeLabel) scopeLabel.innerText = "(敗隊加分: +0, +150, +250)";

        const lossFlatteryOpts = [0, 150, 250];
        if (flatteryGroup) {
          flatteryGroup.innerHTML = lossFlatteryOpts.map(pts => {
            const isActive = selectedFlatteryScore === pts;
            return `
              <button type="button" onclick="setFlatteryScore(${pts})" class="btn-touch py-2 px-1 ${isActive ? 'bg-amber-400 border-2 border-amber-600 text-slate-950 font-black shadow' : 'bg-slate-50 border border-slate-300 text-slate-700 font-bold'} rounded-xl text-xs transition text-center flex flex-col items-center justify-center">
                <span class="text-xs font-black">+${pts} 分</span>
              </button>
            `;
          }).join('');
        }
        if (scoreInput) scoreInput.value = 500 + selectedFlatteryScore;
      }
    }

    async function submitStationScore() {
      const teamName = document.getElementById('stationTeamSelect').value;
      const ptsVal = document.getElementById('stationPointsInput').value;
      const noteVal = document.getElementById('stationNoteInput').value.trim();
      
      if (!teamName || !ptsVal) { showToast('請先選擇隊伍與完成項目計分！', 'error'); return; }
      if (!supabaseClient) { showToast('無網路連線！', 'error'); return; }

      try {
        const { error } = await supabaseClient.from('score_logs').insert([{
          station_name: '關主計分台',
          team_name: teamName,
          points: parseInt(ptsVal),
          note: noteVal,
          created_at: new Date().toISOString()
        }]);

        if (error) throw error;
        showToast(`成功為 ${teamName} 登記 +${ptsVal} 分！`, 'success');
        document.getElementById('stationNoteInput').value = '';
      } catch(e) {
        showToast('上傳得分失敗！', 'error');
      }
    }

    window.onload = function() {
      const select = document.getElementById('stationTeamSelect');
      if (select) {
        TEAM_NAMES.forEach(t => select.innerHTML += `<option value="${t}">${t} 小隊</option>`);
      }
      updateScoringUI();
    };
  </script>
</body>
</html>
